[ArchipelagoMod]
; Master enable switch. Set to false to start in Vanilla Mode (can still be toggled anytime in-game with F10).
enabled = true

; Localhost TCP port used by Croc2Client.py to communicate with croc2_ap_hook.dll
port = 43825

; Virtual-Key code for the in-game Vanilla/Randomizer toggle hotkey (0x79 = F10)
toggle_hotkey_vk = 0x79

; Virtual-Key code to open/close the in-game Croc-themed Archipelago Connection Menu (0x78 = F9)
menu_hotkey_vk = 0x78

; Fire Breakout Trap visual flame effect and knockback recoil in milliseconds (instant -1 heart damage)
fire_trap_knockback_ms = 2000

; Testing aid: set to 1 to write croc2_ap_debug.log next to croc2.exe (map loads, pickups,
; checks, game state changes). Leave at 0 for normal play.
debug_watch = 0

[ServerConnection]
; Default Archipelago Server connection details (editable in-game by pressing F9)
server_host = localhost
server_port = 38281
; Case-sensitive player slot name
slot_name = Player1
; Optional room password
password = 

[RandomizerSettings]
lock_level_access = true
shuffle_white_crystals = 3
shuffle_pete_store = 1
shuffle_abilities = true
shuffle_levers = true
shuffle_vehicles = true
shuffle_plane_guns = true
door_shuffle = 1
goal = 0
jigsaw_pieces_required = 4
trophies_required = 16
trap_weight = 20
fire_breakout_trap = true
death_link = false 
