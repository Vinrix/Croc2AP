[ArchipelagoMod]
; Master enable switch. Set to false to start in Vanilla Mode (can still be toggled anytime in-game with F10).
enabled = true

; Localhost TCP port used by Croc2Client.py to communicate with croc2_ap_hook.dll
port = 43825

; Virtual-Key code for the in-game Vanilla/Randomizer toggle hotkey (0x79 = F10)
toggle_hotkey_vk = 0x79

; Virtual-Key code to open/close the in-game Croc-themed Archipelago Connection Menu (0x78 = F9)
menu_hotkey_vk = 0x78

; Fire Breakout Trap tick interval in milliseconds (3 ticks before 1 heart damage; front flip extinguishes)
fire_trap_tick_ms = 1500

[ServerConnection]
; Default Archipelago Server connection details (editable in-game by pressing F9)
server_host = localhost
server_port = 38281
; Case-sensitive player slot name
slot_name = Player1
; Optional room password
password = 
