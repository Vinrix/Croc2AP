name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.0.3)'
        required: true
        default: 'v1.0.3'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up MinGW-w64 (GCC/G++)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Determine Release Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT

      - name: Compile C++ Hook DLL & Test Host (MinGW-w64)
        shell: msys2 {0}
        run: |
          mkdir -p build
          g++ -shared -std=c++17 -O2 -s -Wall -Wextra -static -static-libgcc -static-libstdc++ \
            src/hook/croc2_ap_hook.cpp src/hook/version.def \
            -o build/croc2_ap_hook.dll \
            -lws2_32 -lwinhttp -lgdi32 -luser32
          cp build/croc2_ap_hook.dll build/version.dll
          if [ -f tests/test_host.cpp ]; then
            g++ -std=c++17 -O2 -s -Wall -Wextra -static -static-libgcc -static-libstdc++ \
              tests/test_host.cpp -o build/test_host.exe
          fi
          ls -la build/

      - name: Compile C# Standalone Launcher
        shell: cmd
        run: |
          call build.bat
          if not exist Croc2ArchipelagoLauncher.exe exit /b 1

      - name: Build croc2.apworld & Run Test Suite
        shell: bash
        run: |
          python installer.py --build-apworld
          python -m unittest tests/test_croc2_ap.py

      - name: Compile 1-Click Installer Setup EXE
        shell: cmd
        run: |
          call build_setup.bat
          if not exist Croc2AP_Setup.exe exit /b 1

      - name: Create Release Distribution Archive
        shell: bash
        run: |
          VER="${{ steps.get_version.outputs.VERSION }}"
          ZIP_NAME="Croc2Archipelago-v${VER}.zip"
          mkdir -p dist/package/assets
          cp Croc2AP_Setup.exe dist/package/
          cp Croc2ArchipelagoLauncher.exe dist/package/
          cp build/version.dll dist/package/
          cp croc2_mod.ini dist/package/
          cp dist/croc2.apworld dist/package/
          cp "templates/Croc 2.yaml" dist/package/
          cp INSTALL_INSTRUCTIONS.txt dist/package/
          cp icon.ico dist/package/
          cp assets/icon.png dist/package/assets/
          cp Install_Croc2AP.bat dist/package/
          cp Uninstall_Croc2AP.bat dist/package/
          cp Toggle_Vanilla_Mode.bat dist/package/
          cp README.md dist/package/
          cd dist/package && 7z a "../${ZIP_NAME}" * && cd ../..
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: Croc 2 Archipelago Randomizer ${{ steps.get_version.outputs.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Croc2AP_Setup.exe
            dist/Croc2Archipelago-*.zip
            dist/croc2.apworld
            templates/Croc 2.yaml
            Croc2ArchipelagoLauncher.exe
            build/version.dll
            assets/icon.png
